name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 scikit-build-core build
      - name: Build wheel
        run: |
          python -m build --wheel
      - name: Smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import kerong; print(kerong.__version__); c = kerong.KerongClient(); print('BoardState:', kerong.BoardState.__doc__ or 'ok')"

  node:
    name: Node.js (${{ matrix.os }} / ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        working-directory: node
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: node
        run: npm run build
      - name: Smoke test
        working-directory: node
        run: |
          node -e "const k = require('./kerong.node'); console.log('class:', k.KerongClient.name); console.log('BoardState:', typeof k.boardStateToObject);"
